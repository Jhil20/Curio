services:
  db:
    image: postgres:16-alpine
    container_name: curio_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-curio_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-curio_password}
      POSTGRES_DB: ${POSTGRES_DB:-curio_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-curio_user} -d ${POSTGRES_DB:-curio_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - curio-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: curio_backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-curio_user}:${POSTGRES_PASSWORD:-curio_password}@db:5432/${POSTGRES_DB:-curio_db}
      - POSTGRES_SERVER=db
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-curio_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-curio_password}
      - POSTGRES_DB=${POSTGRES_DB:-curio_db}
      - BACKEND_CORS_ORIGINS=["http://localhost:5173","http://localhost:3000"]
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    networks:
      - curio-network

volumes:
  postgres_data:
    driver: local

networks:
  curio-network:
    driver: bridge
