default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  # Pre-commit stage: Auto-format and auto-fix lint on staged files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        name: ruff-lint (auto-fix)
        args: [--fix, --config=backend/pyproject.toml]
        files: ^backend/
        stages: [pre-commit]
      - id: ruff-format
        name: ruff-format
        args: [--config=backend/pyproject.toml]
        files: ^backend/
        stages: [pre-commit]

  # Pre-push stage: Static typing and test suite before pushing to GitHub
  - repo: local
    hooks:
      - id: mypy-check
        name: mypy-type-check (pre-push)
        entry: uv run --directory backend mypy app
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-suite
        name: pytest-test-suite (pre-push)
        entry: uv run --directory backend pytest tests
        language: system
        pass_filenames: false
        stages: [pre-push]
